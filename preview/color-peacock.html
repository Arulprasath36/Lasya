<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@300;400;500;600;700&family=Marcellus&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><style>
*{box-sizing:border-box;margin:0}
html,body{background:var(--ink-900);color:var(--fg-1);font-family:var(--font-sans)}
.card{width:700px;padding:26px 30px;background:var(--grad-stage);}
.row{display:flex;gap:14px;flex-wrap:wrap}
.lbl{font-family:var(--font-label);text-transform:uppercase;letter-spacing:.28em;font-size:11px;color:var(--gold-500)}
.mono{font-family:var(--font-sans);font-size:11px;color:var(--fg-3);letter-spacing:.03em}
.sw{border-radius:12px;border:1px solid var(--hairline);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:88px;padding:10px}
.sw .n{font-size:12.5px;color:var(--fg-1);font-weight:500}
.sw .h{font-size:11px;color:rgba(255,255,255,.6);font-family:var(--font-sans)}
</style></head><body><div class="card">
<div class="row" style="gap:10px">
  <div class="sw" style="background:#D8B25A;flex:1;min-width:118px"><div class="n" style="color:#1A1407">Gold</div><div class="h" style="color:rgba(26,20,7,.7)">#D8B25A</div></div><div class="sw" style="background:#0FA6A0;flex:1;min-width:118px"><div class="n" style="color:#fff">Teal</div><div class="h" style="color:rgba(255,255,255,.7)">#0FA6A0</div></div><div class="sw" style="background:#14946A;flex:1;min-width:118px"><div class="n" style="color:#fff">Emerald</div><div class="h" style="color:rgba(255,255,255,.7)">#14946A</div></div><div class="sw" style="background:#2C4BD4;flex:1;min-width:118px"><div class="n" style="color:#fff">Royal</div><div class="h" style="color:rgba(255,255,255,.7)">#2C4BD4</div></div><div class="sw" style="background:#C42E84;flex:1;min-width:118px"><div class="n" style="color:#fff">Magenta</div><div class="h" style="color:rgba(255,255,255,.7)">#C42E84</div></div>
</div>
<div class="row" style="gap:8px;margin-top:10px">
  <div style="flex:1;height:26px;border-radius:6px;background:#F3DDA1"></div><div style="flex:1;height:26px;border-radius:6px;background:#ECCB79"></div><div style="flex:1;height:26px;border-radius:6px;background:#D8B25A"></div><div style="flex:1;height:26px;border-radius:6px;background:#B8923F"></div><div style="flex:1;height:26px;border-radius:6px;background:#2DC2BA"></div><div style="flex:1;height:26px;border-radius:6px;background:#0FA6A0"></div><div style="flex:1;height:26px;border-radius:6px;background:#0A7E7A"></div><div style="flex:1;height:26px;border-radius:6px;background:#2BB57E"></div><div style="flex:1;height:26px;border-radius:6px;background:#14946A"></div><div style="flex:1;height:26px;border-radius:6px;background:#0D6E4F"></div><div style="flex:1;height:26px;border-radius:6px;background:#4A66E0"></div><div style="flex:1;height:26px;border-radius:6px;background:#2C4BD4"></div><div style="flex:1;height:26px;border-radius:6px;background:#1E36A6"></div><div style="flex:1;height:26px;border-radius:6px;background:#DB4C9C"></div><div style="flex:1;height:26px;border-radius:6px;background:#C42E84"></div><div style="flex:1;height:26px;border-radius:6px;background:#9C1F66"></div>
</div></div></body></html>
