<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:var(--ink-900);color:var(--fg-1);font-family:var(--font-sans)}
.card{width:700px;padding:26px 30px;background:var(--grad-stage)}
.lbl{font-family:var(--font-label);text-transform:uppercase;letter-spacing:.28em;font-size:11px;color:var(--gold-500)}
.mono{font-size:11px;color:var(--fg-3)}
.grid{display:flex;gap:10px;margin-top:14px}
.tile{position:relative;flex:1;height:150px;border-radius:12px;overflow:hidden;border:1px solid var(--hairline)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(to top,rgba(7,8,13,.88),transparent)}
.cap span{font-family:var(--font-display);font-style:italic;font-size:15px;color:var(--fg-1)}
</style></head><body><div class="card">
<div class="lbl">Performance photography</div>
<div class="grid">
  <div class="tile"><img src="../assets/photos/silhouette-moon-web.jpg" style="object-position:center 28%"><div class="cap"><span>Moonlight</span></div></div>
  <div class="tile"><img src="../assets/photos/boy-yellow-point-web.jpg"><div class="cap"><span>Full Energy</span></div></div>
  <div class="tile"><img src="../assets/photos/girl-blue-smile-web.jpg" style="object-position:center 20%"><div class="cap"><span>Pure Joy</span></div></div>
  <div class="tile"><img src="../assets/photos/girl-checkered-web.jpg"><div class="cap"><span>Attitude</span></div></div>
</div>
<div class="mono" style="margin-top:12px">Dark-stage, blue-starcloth backdrop · warm cinematic grade · gradient protection scrim + italic serif caption · © View By Anu</div>
</div></body></html>
