<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@300;400;500;600;700&family=Marcellus&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><style>
*{box-sizing:border-box;margin:0}
html,body{background:var(--ink-900);color:var(--fg-1);font-family:var(--font-sans)}
.card{width:700px;padding:26px 30px;background:var(--grad-stage);}
.row{display:flex;gap:14px;flex-wrap:wrap}
.lbl{font-family:var(--font-label);text-transform:uppercase;letter-spacing:.28em;font-size:11px;color:var(--gold-500)}
.mono{font-family:var(--font-sans);font-size:11px;color:var(--fg-3);letter-spacing:.03em}
.sw{border-radius:12px;border:1px solid var(--hairline);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:88px;padding:10px}
.sw .n{font-size:12.5px;color:var(--fg-1);font-weight:500}
.sw .h{font-size:11px;color:rgba(255,255,255,.6);font-family:var(--font-sans)}
</style></head><body><div class="card">
<div class="lbl" style="margin-bottom:14px">Elevation · depth comes from glow on dark</div>
<div class="row">
  <div style="flex:1;text-align:center"><div style="height:78px;background:#101728;border-radius:14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.7)"></div><div class="mono" style="margin-top:8px">shadow-md</div></div>
  <div style="flex:1;text-align:center"><div style="height:78px;background:#101728;border-radius:14px;box-shadow:0 40px 80px -30px rgba(0,0,0,.85)"></div><div class="mono" style="margin-top:8px">shadow-lg</div></div>
  <div style="flex:1;text-align:center"><div style="height:78px;background:#101728;border-radius:14px;box-shadow:0 0 0 1px rgba(236,203,121,.18),0 18px 50px -18px rgba(216,178,90,.45)"></div><div class="mono" style="margin-top:8px">glow-gold</div></div>
  <div style="flex:1;text-align:center"><div style="height:78px;background:#101728;border-radius:14px;box-shadow:0 18px 50px -20px rgba(15,166,160,.5)"></div><div class="mono" style="margin-top:8px">glow-teal</div></div>
</div></div></body></html>
